<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG VOTE | Power by TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #020617;
            color: #ffffff;
            overflow-x: hidden;
        }
        .bg-grid {
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .player-row {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border-right: 4px solid #facc15;
            transition: all 0.3s ease;
        }
        .voted-state {
            border-right-color: #4ade80 !important;
            opacity: 0.8;
        }
        .progress-bar {
            transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
    </style>
</head>
<body class="min-h-screen bg-grid">

    <div class="max-w-2xl mx-auto px-4 py-10">
        <div class="text-center mb-12">
            <h2 class="text-yellow-400 font-black tracking-[0.3em] text-sm mb-2 uppercase">Tournament System</h2>
            <h1 class="text-6xl font-black italic mb-2 tracking-tighter">BATTLE <span class="text-yellow-400 text-shadow">VOTE</span></h1>
            <p class="text-gray-400 font-bold uppercase text-xs">Power by <span class="text-white">TECH</span></p>
        </div>

        <!-- Status Message -->
        <div id="vote-status-msg" class="hidden mb-6 p-4 rounded-xl bg-green-500/20 border border-green-500/50 text-green-400 text-center font-bold">
            لقد قمت بالتصويت بالفعل! شكراً لمشاركتك. 🏆
        </div>

        <div class="grid grid-cols-2 gap-4 mb-10">
            <div class="bg-white/5 border border-white/10 p-5 rounded-2xl text-center">
                <p class="text-gray-500 text-xs font-bold mb-1 uppercase tracking-widest">إجمالي الأصوات</p>
                <span id="total-votes" class="text-4xl font-black text-yellow-400">0</span>
            </div>
            <div class="bg-white/5 border border-white/10 p-5 rounded-2xl text-center">
                <p class="text-gray-500 text-xs font-bold mb-1 uppercase tracking-widest">حالة التصويت</p>
                <div id="device-status" class="text-lg font-black text-yellow-500 italic uppercase">جاهز</div>
            </div>
        </div>

        <div id="voters-container" class="space-y-6">
            <div class="h-24 bg-white/5 rounded-2xl animate-pulse"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, collection, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkl7sqYS6ENhuPBDqM9fbIOq0n7tvnXOM",
            authDomain: "championships-10bdd.firebaseapp.com",
            projectId: "championships-10bdd",
            storageBucket: "championships-10bdd.firebasestorage.app",
            messagingSenderId: "630860402961",
            appId: "1:630860402961:web:f12889bbe3bd0932ce7cb0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const tournamentId = "pubg_final_v1";

        let hasVoted = localStorage.getItem(`voted_${tournamentId}`) === 'true';

        async function init() {
            try {
                await signInAnonymously(auth);
                updateVoteUIStatus();
                loadRealtimeData();
            } catch (e) {
                console.error("Auth failed");
            }
        }

        function updateVoteUIStatus() {
            if (hasVoted) {
                document.getElementById('vote-status-msg').classList.remove('hidden');
                document.getElementById('device-status').innerText = "تم التصويت";
                document.getElementById('device-status').className = "text-lg font-black text-green-500 italic uppercase";
            }
        }

        function loadRealtimeData() {
            const container = document.getElementById('voters-container');
            const totalEl = document.getElementById('total-votes');

            onSnapshot(collection(db, 'artifacts', tournamentId, 'public', 'data', 'players'), (snap) => {
                let data = [];
                let total = 0;
                snap.forEach(d => {
                    data.push(d.data());
                    total += (d.data().votes || 0);
                });

                totalEl.innerText = total;
                data.sort((a, b) => b.votes - a.votes);

                container.innerHTML = '';
                data.forEach(p => {
                    const pct = total === 0 ? 0 : Math.round((p.votes / total) * 100);
                    const div = document.createElement('div');
                    div.className = `player-row p-5 rounded-xl shadow-xl overflow-hidden relative ${hasVoted ? 'voted-state' : ''}`;
                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-4 relative z-10">
                            <div>
                                <h3 class="text-xl font-black tracking-tight">${p.name}</h3>
                                <p class="text-yellow-400 text-xs font-bold">${p.votes} صوت</p>
                            </div>
                            <span class="text-3xl font-black italic opacity-20">${pct}%</span>
                        </div>
                        <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden mb-5">
                            <div class="progress-bar bg-yellow-400 h-full rounded-full" style="width: ${pct}%"></div>
                        </div>
                        <button onclick="castVote('${p.name}')" 
                            ${hasVoted ? 'disabled' : ''}
                            class="w-full py-3 ${hasVoted ? 'bg-gray-700 text-gray-400 cursor-not-allowed' : 'bg-white text-black hover:bg-yellow-400'} font-black rounded-lg transition-all uppercase italic text-sm">
                            ${hasVoted ? 'تم تسجيل صوتك' : 'إعطاء صوت الآن'}
                        </button>
                    `;
                    container.appendChild(div);
                });
            });
        }

        window.castVote = async (name) => {
            if (hasVoted) return;

            const pRef = doc(db, 'artifacts', tournamentId, 'public', 'data', 'players', name);
            try {
                await updateDoc(pRef, { votes: increment(1) });
                localStorage.setItem(`voted_${tournamentId}`, 'true');
                hasVoted = true;
                updateVoteUIStatus();
                // الريفرش البسيط لتحديث الأزرار
                loadRealtimeData(); 
            } catch (e) {
                console.error("Vote failed");
            }
        };

        init();
    </script>
</body>
</html>
