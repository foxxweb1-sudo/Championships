<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصويت بطولة ببجي - Power by TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #0f172a; /* Dark PUBG-like background */
            color: #f8fafc;
            background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), 
                              url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pubg-yellow {
            color: #facc15;
        }
        .pubg-btn {
            background: #facc15;
            color: #000;
            transition: all 0.3s ease;
        }
        .pubg-btn:hover {
            background: #eab308;
            transform: scale(1.05);
        }
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="text-center my-8">
        <h1 class="text-4xl md:text-6xl font-black mb-2 tracking-tighter">بطولة <span class="pubg-yellow">PUBG</span> الكبرى</h1>
        <p class="text-xl font-bold opacity-80 uppercase">Power by <span class="pubg-yellow">TECH</span></p>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-2xl">
        <div class="glass-card rounded-2xl p-6 shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 border-r-4 border-yellow-400 pr-4">صوّت للاعبك المفضل:</h2>
            
            <div id="voters-list" class="space-y-6">
                <!-- Players will be rendered here -->
            </div>

            <!-- Total Votes Footer -->
            <div class="mt-10 pt-6 border-t border-gray-600 text-center">
                <p class="text-gray-400 mb-1">إجمالي الأصوات</p>
                <div id="total-votes" class="text-4xl font-black pubg-yellow">0</div>
            </div>
        </div>
    </main>

    <!-- Success Message Box -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-card px-6 py-3 rounded-full hidden border-yellow-400 border text-yellow-400 font-bold shadow-lg">
        تم تسجيل صوتك بنجاح! 🏆
    </div>

    <script>
        // Initial Data
        const playersData = [
            { id: 1, name: "يويف حماده", votes: 0 },
            { id: 2, name: "يوسف محمد جمال", votes: 0 },
            { id: 3, name: "محمد علاء", votes: 0 },
            { id: 4, name: "7ØUD3", votes: 0 },
            { id: 5, name: "محمد شاكر", votes: 0 }
        ];

        // Load data from LocalStorage if exists
        let players = JSON.parse(localStorage.getItem('pubg_votes')) || playersData;

        function updateUI() {
            const listContainer = document.getElementById('voters-list');
            const totalVotesEl = document.getElementById('total-votes');
            listContainer.innerHTML = '';
            
            let total = players.reduce((sum, p) => sum + p.votes, 0);
            totalVotesEl.innerText = total;

            players.forEach(player => {
                const percentage = total === 0 ? 0 : Math.round((player.votes / total) * 100);
                
                const card = document.createElement('div');
                card.className = 'relative';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-lg font-bold">${player.name}</span>
                        <div class="text-right">
                            <span class="pubg-yellow font-bold text-xl">${player.votes}</span>
                            <span class="text-xs text-gray-400 mr-1">(${percentage}%)</span>
                        </div>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-4 mb-4 overflow-hidden">
                        <div class="progress-bar bg-yellow-400 h-full rounded-full" style="width: ${percentage}%"></div>
                    </div>
                    <button onclick="vote(${player.id})" class="pubg-btn w-full py-2 rounded font-black uppercase text-sm shadow-lg active:scale-95">
                        إعطاء صوت 🔫
                    </button>
                `;
                listContainer.appendChild(card);
            });

            // Save state
            localStorage.setItem('pubg_votes', JSON.stringify(players));
        }

        function vote(id) {
            const playerIndex = players.findIndex(p => p.id === id);
            if (playerIndex !== -1) {
                players[playerIndex].votes += 1;
                updateUI();
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        // Initial Render
        window.onload = updateUI;
    </script>
</body>
</html>
